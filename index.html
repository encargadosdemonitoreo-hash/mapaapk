<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema de Cobertura</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #1e293b; border-radius: 20px; padding: 30px 24px;
    width: 90%; max-width: 340px; text-align: center; border: 1px solid #334155;
  }
  .btn {
    display: block; width: 100%; height: 50px; line-height: 50px;
    margin-bottom: 12px; border-radius: 12px; font-weight: bold;
    text-decoration: none; font-size: 14px; box-sizing: border-box;
  }
  .btn-blue { background: #1a73e8; color: #fff; }
  .btn-dark { background: #334155; color: #fff; border: 1px solid #475569; }
</style>
</head>
<body>

<div class="card">
  <div style="font-size: 36px; margin-bottom: 10px;">🛡️</div>
  <div style="color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 20px;">SISTEMA MONITOREO</div>

  <a href="consulta.html" class="btn btn-blue" onclick="localStorage.clear();">🔎 MESA DE CONSULTA</a>
  <a href="admin.html" class="btn btn-dark" onclick="localStorage.clear();">🛠️ PANEL ADMINISTRADOR</a>
</div>

</body>
</html>
