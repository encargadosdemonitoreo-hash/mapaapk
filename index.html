<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Previene el zoom accidental y fija el viewport táctil -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- MODO APP REAL (Android e iOS) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IonrayMap">
<meta name="theme-color" content="#1a73e8">

<title>Ionray - Cobertura y Monitoreo</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/styles.css">

<!-- REGISTRO DEL MOTOR DE LA APP (SERVICE WORKER) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('✅ Motor PWA registrado con éxito:', reg.scope))
        .catch((err) => console.warn('❌ Fallo al registrar PWA:', err));
    });
  }
</script>
</head>
