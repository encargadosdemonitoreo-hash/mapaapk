<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal de Acceso - Cobertura Táctica</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #f8fafc;
  }
  .portal-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .logo-escudo { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
  
  .opciones-contenedor { display: flex; flex-direction: column; gap: 14px; }
  
  .btn-acceso {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.25s ease;
    border: 1px solid transparent;
  }
  .btn-acceso:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
  
  .btn-consulta {
    background: #1a73e8;
    border-color: #3b82f6;
  }
  .btn-consulta:hover { background: #1557b0; }
  
  .btn-admin {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.15);
    color: #e2e8f0;
  }
  .btn-admin:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  
  .icono-btn { font-size: 24px; }
  .texto-btn { text-align: left; }
  .sub-btn { display: block; font-size: 10px; font-weight: 400; opacity: 0.8; margin-top: 2px; }
  
  .footer-version { margin-top: 28px; font-size: 10px; color: #64748b; font-weight: 600; }
</style>
</head>
<body>

<div class="portal-card">
  <div class="logo-escudo">🛡️</div>
  <h1>SISTEMA DE COBERTURA</h1>
  <p>Seleccioná el módulo al que querés ingresar</p>

  <div class="opciones-contenedor">
    <a href="consulta.html" class="btn-acceso btn-consulta">
      <span class="icono-btn">🔎</span>
      <div class="texto-btn">
        Mesa de Consulta
        <span class="sub-btn">Verificación de cobertura y abonados</span>
      </div>
    </a>

    <a href="admin.html" class="btn-acceso btn-admin">
      <span class="icono-btn">⚙️</span>
      <div class="texto-btn">
        Panel de Administración
        <span class="sub-btn">Edición de zonas y configuración</span>
      </div>
    </a>
  </div>

  <div class="footer-version">IONRAY TACTICAL SYSTEMS v3.0</div>
</div>

</body>
</html>
