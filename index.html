<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mesa de Consulta de Cobertura</title>
  
  <!-- Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* 1. PREVENIR PULL-TO-REFRESH Y REBOTES EN CELULARES */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    /* BARRA SUPERIOR DE BÚSQUEDA FLOTANTE */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 90%;
      max-width: 450px;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      padding: 6px 4px;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-admin-toggle {
      position: absolute;
      bottom: 20px;
      right: 15px;
      z-index: 1000;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* ESTADO DE CONEXIÓN FIREBASE */
    .status-badge {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    /* MODAL FICHA DE ABONADO / ZONA */
    .info-card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 88%;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.3);
      display: none;
    }

    .info-card h3 { margin: 0 0 6px 0; font-size: 18px; color: #1a73e8; }
    .info-card p { margin: 4px 0; font-size: 14px; color: #444; }
    .info-card .btn-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- BARRA DE BÚSQUEDA -->
  <div class="top-bar">
    <button class="btn-icon">🔍</button>
    <input type="text" id="searchInput" placeholder="Buscar Calle, Esquina o Nº Abonado..." onkeyup="if(event.key==='Enter') ejecutarBusqueda()">
    <button class="btn-icon" onclick="iniciarDictadoVoz()" title="Dictar por Voz">🎙️</button>
  </div>

  <!-- ESTADO DE FIREBASE -->
  <div id="statusBadge" class="status-badge">Conectando a Firebase...</div>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- BOTÓN PARA ACCEDER A ADMIN -->
  <button class="btn-admin-toggle" onclick="toggleAdmin()">👤 Modo Admin</button>

  <!-- FICHA INFORMATIVA DE COBERTURA -->
  <div id="infoCard" class="info-card">
    <button class="btn-close" onclick="cerrarFicha()">✕</button>
    <h3 id="cardTitle">Zona / Abonado</h3>
    <p id="cardDesc">Información de la ubicación seleccionada.</p>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase App & Database (SDK v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // -----------------------------------------------------------
    // 1. CONFIGURACIÓN DE FIREBASE (Datos Guardados)
    // -----------------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://GPSMESA-default-rtdb.firebaseio.com" // Asegurate de que esta sea tu URL de Firebase
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // -----------------------------------------------------------
    // 2. INICIALIZACIÓN DEL MAPA (CartoDB / OpenStreetMap HD)
    // -----------------------------------------------------------
    const map = L.map('map', {
      zoomControl: false,
      bounceAtZoomLimits: false
    }).setView([-34.6037, -58.3816], 13); // Coordenadas por defecto (Buenos Aires / Ajustable)

    // Capa ultrarrápida basada en OpenStreetMap (Sin bloqueos de tiles)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // -----------------------------------------------------------
    // 3. DESCARGA EN TIEMPO REAL DESDE FIREBASE
    // -----------------------------------------------------------
    const statusBadge = document.getElementById('statusBadge');

    db.ref('zonas').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        let cantidad = 0;
        Object.keys(data).forEach(key => {
          const zona = data[key];
          if (zona.coords) {
            L.polygon(zona.coords, {
              color: zona.color || '#1a73e8',
              fillOpacity: 0.35
            }).addTo(map).bindPopup(`<b>${zona.nombre}</b><br>${zona.notas || ''}`);
            cantidad++;
          }
        });
        statusBadge.innerText = `🟢 Conectado - ${cantidad} Zonas Cargadas`;
      } else {
        statusBadge.innerText = '🟢 Conectado - Sin zonas guardadas';
      }
    }, (error) => {
      statusBadge.innerText = '🔴 Error de conexión con Firebase';
      console.error(error);
    });

    // -----------------------------------------------------------
    // 4. MOTOR DE BÚSQUEDA DE ALTA PRECISIÓN (Nominatim OSM)
    // -----------------------------------------------------------
    function ejecutarBusqueda() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      statusBadge.innerText = '🔍 Buscando ubicación...';

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`, {
        headers: { 'User-Agent': 'MesaDeConsultaApp/1.0' }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const result = data[0];
          const lat = parseFloat(result.lat);
          const lon = parseFloat(result.lon);

          map.setView([lat, lon], 16);

          L.marker([lat, lon]).addTo(map)
            .bindPopup(`<b>Ubicación encontrada:</b><br>${result.display_name}`)
            .openPopup();

          mostrarFicha("Resultado de Búsqueda", result.display_name);
          statusBadge.innerText = '🟢 Conectado';
        } else {
          alert('No se encontraron resultados para esa búsqueda.');
          statusBadge.innerText = '🟢 Conectado';
        }
      })
      .catch(err => {
        alert('Error al realizar la búsqueda.');
        statusBadge.innerText = '🟢 Conectado';
      });
    }

    // Dictado por Voz
    function iniciarDictadoVoz() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Tu navegador o teléfono no soporta dictado por voz.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-AR';
      recognition.start();

      statusBadge.innerText = '🎙️ Escuchando...';

      recognition.onresult = function(event) {
        const texto = event.results[0][0].transcript;
        document.getElementById('searchInput').value = texto;
        ejecutarBusqueda();
      };

      recognition.onerror = function() {
        statusBadge.innerText = '🟢 Conectado';
      };
    }

    // -----------------------------------------------------------
    // 5. MANEJO DE FICHAS E INTERFAZ
    // -----------------------------------------------------------
    function mostrarFicha(titulo, desc) {
      document.getElementById('cardTitle').innerText = titulo;
      document.getElementById('cardDesc').innerText = desc;
      document.getElementById('infoCard').style.display = 'block';
    }

    function cerrarFicha() {
      document.getElementById('infoCard').style.display = 'none';
    }

    function toggleAdmin() {
      const pass = prompt("Ingrese la contraseña de Administrador:");
      if (pass === "admin123") { // Podés cambiar esta clave
        alert("Modo Administrador activado. Habilitando herramientas...");
        // Podés redirigir a admin.html si tenés el panel en otro archivo
        window.location.href = "admin.html";
      } else if (pass !== null) {
        alert("Contraseña incorrecta.");
      }
    }
  </script>
</body>
</html>
