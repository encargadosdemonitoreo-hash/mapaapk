name: Compilar APK Nativa Capacitor

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crear estructura de directorio para Capacitor
        run: |
          mkdir -p www
          cp index.html www/

      - name: Instalar y Configurar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IONRAY Cobertura" "com.ionray.cobertura" --web-dir www
          npx cap add android

      - name: Reemplazar Íconos y Splash Screen Nativos
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          RES_DIR="android/app/src/main/res"
          
          # Crear carpetas si no existen
          mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi
          mkdir -p $RES_DIR/drawable $RES_DIR/drawable-port-xxhdpi
          
          # Generar íconos estándar de aplicación
          convert icon.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          # Generar íconos redondos y de primer plano
          convert icon.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          convert icon.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          convert icon.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert icon.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert icon.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          
          convert icon.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_foreground.png
          convert icon.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_foreground.png
          convert icon.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png
          convert icon.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png
          convert icon.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Reemplazar la pantalla de splash nativa
          convert icon.png -resize 512x512 $RES_DIR/drawable/splash.png
          convert icon.png -resize 512x512 $RES_DIR/drawable-port-xxhdpi/splash.png

      - name: Inyectar Permisos Nativos de GPS y Micrófono
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          sed -i "/<\/manifest>/i $PERMS" $MANIFEST
          npx cap sync android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generada
        uses: actions/upload-artifact@v4
        with:
          name: IONRAY-Cobertura-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
