name: Compilar APK Nativa Capacitor

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Crear estructura de directorio para Capacitor
        run: |
          mkdir -p www
          cp index.html www/

      - name: Instalar y Configurar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/assets
          npx cap init "IONRAY Cobertura" "com.ionray.cobertura" --web-dir www
          npx cap add android

      - name: Generar Íconos Nativos de Android desde icon.png
        run: |
          npx capacitor-assets generate --android --iconBackend cordova --iconPath icon.png || npx @capacitor/assets generate --android

      - name: Inyectar Permisos Nativos de GPS y Micrófono
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          sed -i "/<\/manifest>/i $PERMS" $MANIFEST
          npx cap sync android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generada
        uses: actions/upload-artifact@v4
        with:
          name: IONRAY-Cobertura-Nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
