<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Consulta de Cobertura - Mobile App</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --primary: #1a73e8;
  --bg-dark: #0f172a;
  --surface-light: rgba(255, 255, 255, 0.95);
  --surface-dark: rgba(30, 41, 59, 0.95);
  --radius-app: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #000; }

body.modo-consulta-manual #map { cursor: crosshair !important; }

/* BARRA SUPERIOR COMPACTA (APP HEADER) */
.app-header {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2000;
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  pointer-events: none;
}
.header-card {
  pointer-events: auto; background: var(--surface-light); backdrop-filter: blur(12px);
  padding: 8px 14px; border-radius: var(--radius-app); box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid rgba(0,0,0,0.08);
}
.btn-user-badge {
  background: #f1f5f9; border: 1px solid #cbd5e0; border-radius: 12px;
  padding: 6px 12px; font-size: 11px; font-weight: 800; color: #334155; cursor: pointer; height: 36px;
  display: flex; align-items: center; gap: 6px;
}

/* BUSCADOR FLOTANTE CON TABS */
.search-container {
  position: absolute; top: 68px; left: 12px; right: 12px; z-index: 2000;
  background: var(--surface-light); backdrop-filter: blur(12px); border-radius: var(--radius-app);
  padding: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.18); border: 1px solid rgba(0,0,0,0.08);
}
.search-tabs { display: flex; gap: 6px; margin-bottom: 8px; background: #e2e8f0; padding: 3px; border-radius: 12px; }
.tab-btn { flex: 1; height: 32px; border: 0; background: transparent; border-radius: 9px; font-size: 11px; font-weight: 800; color: #64748b; cursor: pointer; transition: all 0.2s; }
.tab-btn.activo { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

.linea-input { display: flex; gap: 6px; align-items: center; }
.app-input {
  flex: 1; height: 42px; padding: 0 12px; border: 1px solid #cbd5e0; border-radius: 12px;
  font-size: 13px; font-weight: 600; outline: none; background: #fff; color: #0f172a;
}
.app-input:focus { border-color: var(--primary); }

.btn-icon-action { width: 42px; height: 42px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.btn-primary-action { background: var(--primary); color: #fff; }
.btn-clear-action { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e0; }

.sugerencias-consulta { display: none; position: absolute; left: 0; right: 0; top: 102px; z-index: 2010; background: #fff; border: 1px solid #cbd5e0; border-radius: 14px; max-height: 180px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.sugerencia-item { padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }

/* BARRA INFERIOR TÁCTIL (BOTTOM DOCK) */
.bottom-dock {
  position: absolute; bottom: 16px; left: 12px; right: 12px; z-index: 2000;
  background: var(--surface-light); backdrop-filter: blur(12px); border-radius: 22px;
  padding: 6px; display: flex; justify-content: space-around; align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25); border: 1px solid rgba(0,0,0,0.08);
}
.dock-btn {
  flex: 1; height: 44px; border: 0; background: transparent; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; font-weight: 800; color: #475569; cursor: pointer; transition: all 0.2s;
}
.dock-btn span { font-size: 16px; }
.dock-btn.activo { background: var(--primary); color: #fff; }

/* PANEL MODAL Y AJUSTES */
.panel-drawer {
  position: absolute; bottom: -100%; left: 0; right: 0; z-index: 3000;
  background: #fff; border-radius: 24px 24px 0 0; padding: 20px;
  max-height: 80vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
  transition: bottom 0.35s ease-in-out;
}
.panel-drawer.abierto { bottom: 0; }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }

/* LOGIN OVERLAY */
#loginOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); z-index: 10000 !important; display: flex; align-items: center; justify-content: center; }
#loginOverlay.oculto { display: none !important; }
.login-card { width: 320px; background: #fff; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); color: #202124; }

/* ESTILOS TEMA OSCURO Y TÁCTICO */
body.modo-dark .header-card, body.modo-dark .search-container, body.modo-dark .bottom-dock, body.modo-dark .panel-drawer { background: var(--surface-dark); color: #f8fafc; border-color: #334155; }
body.modo-dark .app-input { background: #0f172a; color: #fff; border-color: #334155; }
body.modo-dark .search-tabs { background: #1e293b; }
body.modo-dark .tab-btn.activo { background: #334155; color: #38bdf8; }
body.modo-dark .dock-btn { color: #94a3b8; }

body.modo-tactico .header-card, body.modo-tactico .search-container, body.modo-tactico .bottom-dock, body.modo-tactico .panel-drawer { background: rgba(15,15,15,0.95); color: #ff5252; border: 1px solid #ff1744; }
body.modo-tactico .app-input { background: #000; color: #ff1744; border-color: #b71c1c; }
body.modo-tactico .dock-btn { color: #ff5252; }

.solo-verificador, .solo-admin { display: none !important; }
body.es-verificador .solo-verificador { display: block !important; }
body.es-admin .solo-verificador, body.es-admin .solo-admin { display: block !important; }

/* BURBUJA POPUP MOBILE */
.leaflet-popup-content-wrapper { padding: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.burbuja-marcacion { padding: 14px; min-width: 260px; max-width: 310px; cursor: pointer; }
.burbuja-cabecera { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.burbuja-cobertura { background: #e6f4ea; color: #137333; border: 2px solid #34a853; }
.burbuja-peligrosa { background: #fce8e6; color: #c5221f; border: 2px solid #ea4335; }
.burbuja-fuera { background: #1e293b; color: #fff; border: 2px solid #475569; }

.grupo-botones-nav { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.btn-nav { padding: 6px 10px; background: #fff; border: 1px solid #dadce0; border-radius: 12px; font-size: 10px; font-weight: 800; text-decoration: none; color: #334155; }

#indicadorSyncStatus { position: absolute; top: 16px; right: 16px; z-index: 1500; font-size: 9px; font-weight: 800; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 12px; display: none; }
</style>
</head>
<body>

<div id="loginOverlay" class="oculto">
  <div class="login-card">
    <div style="font-size:36px; margin-bottom:6px;">🛡️</div>
    <div style="font-weight:800; font-size:16px; margin-bottom:12px;">ACCESO AL SISTEMA</div>
    <form id="formLogin" autocomplete="off">
      <input type="text" id="usr" placeholder="Usuario" class="app-input" style="width:100%; margin-bottom:8px;">
      <input type="password" id="pwd" placeholder="Contraseña" class="app-input" style="width:100%; margin-bottom:12px;">
      <button type="submit" class="btn-icon-action btn-primary-action" style="width:100%; height:42px; font-size:13px;">🔑 Iniciar Sesión</button>
      <button type="button" id="btnCerrarLogin" style="width:100%; height:34px; margin-top:6px; background:transparent; color:#64748b; border:0; cursor:pointer; font-size:12px;">Cancelar</button>
    </form>
  </div>
</div>

<div id="map"></div>
<div id="indicadorSyncStatus">🟢 Sincronizado</div>

<!-- APP HEADER -->
<div class="app-header">
  <div class="header-card">
    <div style="font-weight:900; font-size:13px; color:var(--primary); display:flex; align-items:center; gap:6px;">
      <span>🛡️</span> <span>MESA TÁCTICA</span>
    </div>
    <button id="btnToggleAuth" class="btn-user-badge" type="button">
      <span>👤</span> <span id="txtUserSesion">Invitado</span>
    </button>
  </div>
</div>

<!-- BUSCADOR CON TABS -->
<div class="search-container">
  <div class="search-tabs">
    <button id="tabDir" class="tab-btn activo" type="button">📍 Dirección / Esquina</button>
    <button id="tabAB" class="tab-btn solo-verificador" type="button">🏢 Abonado AB</button>
  </div>

  <div id="secBuscadorDir" class="linea-input">
    <input id="direccion" autocomplete="off" class="app-input" placeholder="Buscar calle, altura...">
    <button id="btnLimpiarInput" class="btn-icon-action btn-clear-action" type="button">❌</button>
    <button id="buscar" class="btn-icon-action btn-primary-action" type="button">🔍</button>
  </div>

  <div id="secBuscadorAB" class="linea-input solo-verificador" style="display:none;">
    <input id="buscarABInput" autocomplete="off" class="app-input" placeholder="N° de Abonado (ej. 1045)...">
    <button id="btnLimpiarAB" class="btn-icon-action btn-clear-action" type="button">❌</button>
    <button id="btnBuscarAB" class="btn-icon-action btn-primary-action" type="button">🔍</button>
  </div>

  <div id="sugerenciasConsulta" class="sugerencias-consulta"></div>
  <div id="sugerenciasAB" class="sugerencias-consulta"></div>
</div>

<!-- BOTTOM DOCK NAVEGACIÓN -->
<div class="bottom-dock">
  <button id="btnGPSConsulta" class="dock-btn" type="button"><span>📍</span> GPS</button>
  <button id="btnClicMapa" class="dock-btn" type="button"><span>🎯</span> Marcador</button>
  <button id="btnAbrirAjustes" class="dock-btn" type="button"><span>⚙️</span> Capas/Ajustes</button>
  <button id="btnAbrirAdmin" class="dock-btn solo-admin" type="button"><span>👥</span> Personas</button>
</div>

<!-- PANEL DRAWER (CONFIGURACIÓN Y USUARIOS) -->
<div id="panelDrawer" class="panel-drawer">
  <div class="drawer-header">
    <div style="font-weight:800; font-size:14px;">⚙️ Ajustes & Administración</div>
    <button id="btnCerrarDrawer" style="border:0; background:transparent; font-size:18px; cursor:pointer;">❌</button>
  </div>

  <div style="display:flex; gap:6px; margin-bottom:12px;">
    <select id="mapaEstiloConsulta" class="app-input" style="flex:1; height:36px; font-size:11px;">
      <option value="esriStreet">🏙️ Esri Street HD</option>
      <option value="satelitalHibrido">🛰️ Satelital HD</option>
      <option value="calles">🗺️ OpenStreetMap</option>
    </select>
    
    <select id="selectorTemaPanel" class="app-input" style="flex:1; height:36px; font-size:11px;">
      <option value="claro">☀️ Modo Claro</option>
      <option value="dark">🌙 Modo Oscuro</option>
      <option value="tactico">🚨 Modo Táctico</option>
    </select>
  </div>

  <div style="margin-bottom:12px;">
    <select id="selectZona" class="app-input" style="width:100%; height:36px; font-size:11px;">
      <option value="">-- Ir a zona especifica --</option>
    </select>
  </div>

  <div class="solo-admin" style="margin-top:14px; border-top:1px solid #cbd5e0; padding-top:10px;">
    <div style="font-size:11px; font-weight:800; color:var(--primary); margin-bottom:6px;">👥 GESTIÓN DE PERSONAS Y ACCESOS</div>
    <input type="hidden" id="usrConsId" value="">
    <input type="text" id="usrConsNombre" placeholder="Nombre completo" class="app-input" style="width:100%; margin-bottom:6px; height:36px; font-size:11px;">
    <input type="text" id="usrConsUser" placeholder="Usuario" class="app-input" style="width:100%; margin-bottom:6px; height:36px; font-size:11px;">
    <input type="password" id="usrConsPass" placeholder="Contraseña" class="app-input" style="width:100%; margin-bottom:6px; height:36px; font-size:11px;">
    
    <select id="usrConsRol" class="app-input" style="width:100%; height:36px; font-size:11px; margin-bottom:6px;">
      <option value="SUPER_ADMIN">👑 SUPER_ADMIN</option>
      <option value="VERIFICADOR">🔍 VERIFICADOR</option>
      <option value="INVITADO">👤 INVITADO</option>
    </select>

    <button id="btnGuardarUsrConsulta" class="btn-icon-action btn-primary-action" type="button" style="width:100%; height:36px; font-size:11px; margin-bottom:6px;">💾 Guardar Registro</button>
    
    <div id="listaUsuariosConsulta" style="max-height:120px; overflow-y:auto; border:1px solid #cbd5e0; border-radius:10px; margin-bottom:8px;"></div>
    
    <button id="btnSincronizarUsuariosFB" class="btn-icon-action" type="button" style="width:100%; height:36px; font-size:11px; background:#1e8e3e; color:#fff;">🚀 Sincronizar Base a Firebase</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
"use strict";

const map = L.map("map", { center: [-34.6486, -58.6198], zoom: 11, zoomControl: false });
map.createPane('panelMarcadores').style.zIndex = 650;

const satelitalFoto = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 });
const satelitalRutas = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 });

const capasBase = {
  esriStreet: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
  satelitalHibrido: L.layerGroup([satelitalFoto, satelitalRutas]),
  calles: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 })
};
capasBase.esriStreet.addTo(map);

document.getElementById("mapaEstiloConsulta").onchange = function(){
  Object.values(capasBase).forEach(c => map.removeLayer(c));
  if(capasBase[this.value]) capasBase[this.value].addTo(map);
};

// MANEJO DE TABS DE BÚSQUEDA
const tabDir = document.getElementById("tabDir");
const tabAB = document.getElementById("tabAB");
const secDir = document.getElementById("secBuscadorDir");
const secAB = document.getElementById("secBuscadorAB");

if(tabDir && tabAB) {
  tabDir.onclick = () => {
    tabDir.classList.add("activo"); tabAB.classList.remove("activo");
    secDir.style.display = "flex"; secAB.style.display = "none";
  };
  tabAB.onclick = () => {
    tabAB.classList.add("activo"); tabDir.classList.remove("activo");
    secAB.style.display = "flex"; secDir.style.display = "none";
  };
}

// MANEJO DE PANEL DRAWER
const panelDrawer = document.getElementById("panelDrawer");
document.getElementById("btnAbrirAjustes").onclick = () => panelDrawer.classList.add("abierto");
document.getElementById("btnAbrirAdmin").onclick = () => panelDrawer.classList.add("abierto");
document.getElementById("btnCerrarDrawer").onclick = () => panelDrawer.classList.remove("abierto");

let rolActual = "INVITADO";
let nombreUsuarioActual = "Invitado";
let usuariosConsultaLocal = [];
let elementos = [], abonadosLocal = [], capas = [], marker = null;
const loginOverlay = document.getElementById("loginOverlay");
const txtUserSesion = document.getElementById("txtUserSesion");

function establecerRol(rol, nombreUsuario) {
  const r = (rol || "INVITADO").toString().toUpperCase().trim();
  nombreUsuarioActual = nombreUsuario || "Invitado";
  document.body.classList.remove("es-admin", "es-verificador");

  if (r === "SUPER_ADMIN") {
    rolActual = "SUPER_ADMIN";
    document.body.classList.add("es-admin");
    txtUserSesion.textContent = `${nombreUsuarioActual} (ADMIN)`;
  } else if (r === "VERIFICADOR") {
    rolActual = "VERIFICADOR";
    document.body.classList.add("es-verificador");
    txtUserSesion.textContent = `${nombreUsuarioActual} (VERIF)`;
  } else {
    rolActual = "INVITADO";
    txtUserSesion.textContent = "Invitado";
  }
}

// ARRANQUE BLINDADO EN INVITADO
establecerRol("INVITADO", "Invitado");

function cargarUsuariosConsultaLocal() {
  const data = localStorage.getItem("usuariosConsultaPropio");
  if (data) { try { usuariosConsultaLocal = JSON.parse(data); } catch(e) {} }
  if (!usuariosConsultaLocal || usuariosConsultaLocal.length === 0) {
    usuariosConsultaLocal = [{ id: "u_cons_1", nombre: "IONRAY Master", usuario: "ionray", clave: "ionray", rol: "SUPER_ADMIN" }];
  }
}

document.getElementById("btnToggleAuth").onclick = () => {
  if (rolActual !== "INVITADO") { establecerRol("INVITADO"); } else { loginOverlay.classList.remove("oculto"); }
};
document.getElementById("btnCerrarLogin").onclick = () => loginOverlay.classList.add("oculto");

document.getElementById("formLogin").onsubmit = function(e){
  e.preventDefault();
  const u = document.getElementById("usr").value.trim().toLowerCase();
  const p = document.getElementById("pwd").value.trim();

  let lista = Array.isArray(usuariosConsultaLocal) ? usuariosConsultaLocal : Object.values(usuariosConsultaLocal || {});
  const enco = lista.find(x => x && x.usuario && x.usuario.toLowerCase() === u && x.clave === p);

  if (enco) {
    establecerRol(enco.rol, enco.nombre || enco.usuario);
    loginOverlay.classList.add("oculto");
  } else if (u === "ionray" && p === "ionray") {
    establecerRol("SUPER_ADMIN", "IONRAY");
    loginOverlay.classList.add("oculto");
  } else {
    alert("Usuario o clave incorrecta.");
  }
};

let modoConsultaClic = false;
const btnClicMapa = document.getElementById("btnClicMapa");
btnClicMapa.onclick = function() {
  modoConsultaClic = !modoConsultaClic;
  btnClicMapa.classList.toggle("activo", modoConsultaClic);
};

map.on("click", async function(e) {
  if(modoConsultaClic) {
    modoConsultaClic = false;
    btnClicMapa.classList.remove("activo");
    verificarPunto(e.latlng.lat, e.latlng.lng, `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
  }
});

function verificarPunto(lat, lon, nombre) {
  const pt = L.latLng(lat, lon);
  if(marker) map.removeLayer(marker);

  const html = '<div class="burbuja-marcacion burbuja-cobertura">' +
    '<div class="burbuja-cabecera">🛡️ DENTRO DE COBERTURA</div>' +
    '<div style="font-size:11px; margin-top:4px;"><b>Ubicación:</b> ' + nombre + '</div>' +
    '<div class="grupo-botones-nav">' +
      '<a href="https://waze.com/ul?ll=' + lat + ',' + lon + '&navigate=yes" target="_blank" class="btn-nav">🚙 Waze</a>' +
      '<a href="https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon + '" target="_blank" class="btn-nav">🗺️ Maps</a>' +
    '</div>' +
  '</div>';

  marker = L.marker(pt).addTo(map);
  marker.bindPopup(html, { closeButton: false }).openPopup();
  map.setView(pt, 15);
}

cargarUsuariosConsultaLocal();
});
</script>
</body>
</html>
